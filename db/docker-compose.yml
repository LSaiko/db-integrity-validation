services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: bookings
      POSTGRES_PASSWORD: bookings
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookings"]
      interval: 2s
      retries: 15

  # system under test: minimal booking API writing to the postgres above
  api:
    build: ../server
    environment:
      DATABASE_URL: postgresql://bookings:bookings@postgres:5432/bookings
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
